<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171a38" />
    <title>시계는 째깍! 하루는 찰칵!</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #252945;
        --muted: #72748b;
        --paper: #faf8f1;
        --line: #e7e3d9;
        --purple: #6359ce;
        --mint: #d6efe3;
        --peach: #ffe1d1;
        --lavender: #e8e0f8;
        --shadow: 0 8px 0 rgba(37, 41, 69, 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          17px/1.55 'Apple SD Gothic Neo',
          'Malgun Gothic',
          system-ui,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        border: 0;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #8c71f1;
        outline-offset: 4px;
      }
      button {
        touch-action: manipulation;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: clamp(30px, 4vw, 46px);
        letter-spacing: -2px;
        line-height: 1.3;
      }
      h2 {
        font-size: 25px;
      }
      p {
        color: var(--muted);
      }
      .page {
        max-width: 1180px;
        margin: auto;
        padding: 28px 32px 60px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 36px;
        flex-wrap: wrap;
      }
      .brand {
        font-weight: 900;
        letter-spacing: -1px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 9px 17px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 30px;
        font-weight: 800;
      }
      .chip:before {
        content: '✦';
        color: var(--purple);
      }
      .primary,
      .secondary,
      .ghost,
      .tab {
        min-height: 48px;
        border-radius: 14px;
        padding: 12px 20px;
        font-weight: 800;
      }
      .primary {
        background: var(--purple);
        color: white;
        box-shadow: 0 4px 0 #48409e;
      }
      .primary:active {
        transform: none;
        box-shadow: 0 2px 0 #48409e;
      }
      .secondary {
        background: white;
        border: 1px solid var(--line);
      }
      .ghost {
        background: transparent;
      }
      .ghost:hover {
        background: #ece8de;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--purple);
        display: block;
        margin-bottom: 12px;
      }
      .heading {
        text-align: center;
        margin: 20px 0 38px;
      }
      .heading h1 {
        margin-bottom: 12px;
      }
      .heading p {
        margin-bottom: 0;
      }
      .subtle {
        font-size: 14px;
        color: var(--muted);
      }
      .center {
        text-align: center;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 26px;
        box-shadow: var(--shadow);
      }
      .notice {
        background: #fff0ca;
        padding: 14px 20px;
        border-radius: 14px;
        margin: 18px 0;
        color: #6d561b;
      }
      .notice.error {
        background: #fff0ed;
        color: #9e3d35;
      }
      .notice.success {
        background: #e1f3e6;
        color: #2c6c4a;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 25px;
      }
      .footer-note {
        text-align: center;
        font-size: 14px;
        margin-top: 28px;
      }
      .save-note {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        padding: 12px;
      }
      .title-page {
        min-height: 100svh;
        background: #171a38;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 24px 32px;
        text-align: center;
        overflow: hidden;
        position: relative;
        background-image:
          radial-gradient(circle at 16% 22%, #43517c 1px, transparent 2px),
          radial-gradient(circle at 79% 37%, #6b719c 1px, transparent 2px),
          linear-gradient(#171a38, #232046);
        background-size:
          79px 83px,
          133px 149px,
          100% 100%;
      }
      .title-page:before {
        content: '';
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        border: 1px solid #727ca533;
        box-shadow:
          0 0 0 60px #727ca50b,
          0 0 0 120px #727ca507;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        pointer-events: none;
      }
      .arcade-label {
        font: 700 12px/1.4 monospace;
        letter-spacing: 6px;
        color: #c0b7ed;
        margin: 20px 0 22px;
      }
      .title-start {
        background: transparent;
        color: white;
        z-index: 1;
        padding: 10px;
        max-width: 100%;
        border-radius: 24px;
      }
      .title-start h1 {
        font-size: clamp(42px, 7.8vw, 82px);
        line-height: 1.28;
        font-weight: 950;
        letter-spacing: -4px;
        text-shadow: 0 5px 0 #0a102d;
        margin: 0;
      }
      .title-start h1 span {
        display: block;
        color: #ffde88;
      }
      .title-start h1 span:first-child {
        color: #d1f2ef;
      }
      .press {
        margin-top: 48px;
        color: #f5d586;
        font: 700 17px monospace;
        letter-spacing: 4px;
        animation: breathe 2.5s ease-in-out infinite;
      }
      .title-caption {
        color: #c6c6da;
        font-size: 14px;
        margin-top: 12px;
      }
      .title-footer {
        z-index: 1;
        margin-top: 55px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .title-footer .ghost {
        color: #c6c6da;
        border: 1px solid #ffffff22;
      }
      .title-footer .ghost:hover {
        background: #ffffff12;
      }
      .mascot-clock {
        width: 100px;
        height: 100px;
        background: #fff9e9;
        border: 8px solid #8dd9cf;
        border-radius: 50%;
        position: relative;
        margin: 0 auto 25px;
        box-shadow: 0 8px 0 #0e122b;
        transform: rotate(-10deg);
      }
      .mascot-clock:before {
        content: '';
        position: absolute;
        left: 39px;
        top: 19px;
        width: 6px;
        height: 27px;
        background: #313752;
        border-radius: 8px;
        transform-origin: 3px 25px;
        transform: rotate(15deg);
      }
      .mascot-clock:after {
        content: '';
        position: absolute;
        left: 40px;
        top: 39px;
        width: 27px;
        height: 5px;
        background: #e59675;
        border-radius: 8px;
        transform: rotate(20deg);
        transform-origin: left center;
      }
      .name-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 850px;
        margin: 0 auto;
      }
      .name-tile {
        min-height: 175px;
        border: 2px solid #fff;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 13px;
        box-shadow: var(--shadow);
        transition: transform 0.18s;
      }
      .name-tile:hover,
      .mode-tile:hover {
        transform: none;
      }
      .avatar {
        width: 65px;
        height: 65px;
        border-radius: 22px;
        background: #ffffff99;
        display: grid;
        place-items: center;
        font-size: 33px;
      }
      .name-text {
        font-size: 25px;
        font-weight: 900;
      }
      .mode-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 23px;
      }
      .mode-tile {
        min-height: 330px;
        padding: 30px;
        text-align: left;
        border-radius: 28px;
        border: 2px solid #fff;
        box-shadow: var(--shadow);
        transition: transform 0.18s;
        display: flex;
        flex-direction: column;
      }
      .mode-top {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 800;
      }
      .mode-symbol {
        font-size: 66px;
        line-height: 1.4;
        margin: 23px 0 16px;
      }
      .mode-title {
        font-size: 27px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .mode-desc {
        font-size: 15px;
        margin-top: 5px;
        color: #565a6b;
      }
      .mode-badge {
        font-size: 12px;
        font-weight: 700;
        margin-top: 25px;
        padding: 5px 12px;
        border-radius: 20px;
        background: #ffffffaa;
        align-self: flex-start;
      }
      .clock {
        display: block;
        width: min(100%, 300px);
        margin: auto;
      }
      .practice-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        max-width: 920px;
        margin: auto;
      }
      .clock-panel {
        display: grid;
        place-items: center;
      }
      .hint-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 15px;
      }
      .clock.zoom {
        transform: scale(1.08);
      }
      .time-readout {
        text-align: center;
        font-size: 35px;
        font-weight: 900;
        margin-bottom: 18px;
        min-height: 54px;
      }
      .time-readout span {
        color: var(--purple);
      }
      .hours {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 7px;
      }
      .hours button,
      .minutes button {
        min-width: 0;
        min-height: 48px;
        background: #f4f2fa;
        border: 2px solid transparent;
        border-radius: 12px;
        font-weight: 800;
      }
      .hours button[aria-pressed='true'],
      .minutes button[aria-pressed='true'] {
        background: #e5defc;
        border-color: var(--purple);
        color: #40349e;
      }
      .minutes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-top: 10px;
      }
      .input-error {
        border: 3px solid #cf594d;
        border-radius: 16px;
        padding: 10px;
      }
      .input-caption {
        font-size: 13px;
        color: #a3453c;
        margin: 8px 0 0;
      }
      .correct {
        font-size: 24px;
        font-weight: 900;
        color: #398261;
        text-align: center;
      }
      .stat {
        font-size: 14px;
        text-align: center;
        margin-top: 12px;
      }
      .reading-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .reading-card {
        padding: 20px;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .card-top h2 {
        font-size: 18px;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .period {
        font-size: 12px;
        font-weight: 900;
        background: #f0ebfc;
        color: #6757ad;
        border-radius: 12px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      .picture-button {
        width: 100%;
        height: 185px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: #f6f5ef;
        position: relative;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .picture-button svg {
        max-height: 165px;
        width: 100%;
      }
      .picture-button .clock {
        height: 165px;
      }
      .flip-hint {
        position: absolute;
        bottom: 7px;
        right: 10px;
        font-size: 11px;
        padding: 3px 9px;
        background: #ffffffe0;
        border-radius: 10px;
      }
      .artwork {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .reading-card .time-readout {
        font-size: 26px;
        margin-bottom: 10px;
        min-height: 40px;
      }
      .reading-card .hours {
        gap: 5px;
      }
      .reading-card .time-input {
        margin-top: 5px;
      }
      .reading-card .hours button {
        min-height: 44px;
      }
      .order-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 780px;
        margin: auto;
      }
      .order-card {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 20px;
        background: white;
        border: 2px solid var(--line);
        border-radius: 22px;
        touch-action: pan-y;
      }
      .order-card.wrong {
        border: 3px solid #cf594d;
      }
      .order-card svg,
      .order-card img {
        width: 90px;
        height: 75px;
        border-radius: 13px;
        background: #f6f4eb;
        flex-shrink: 0;
        object-fit: contain;
      }
      .order-number {
        font-weight: 900;
        font-size: 23px;
        color: #9e95c5;
        min-width: 26px;
      }
      .order-info {
        flex: 1;
      }
      .order-info strong {
        display: block;
        font-size: 18px;
      }
      .order-info small {
        color: var(--muted);
      }
      .order-controls {
        display: flex;
        gap: 6px;
      }
      .move {
        min-width: 48px;
        min-height: 48px;
        border-radius: 12px;
        background: #f0edf7;
        font-size: 21px;
      }
      .completed {
        max-width: 650px;
        margin: 55px auto;
        text-align: center;
      }
      .confetti {
        font-size: 70px;
        line-height: 1.4;
      }
      .timeline {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
      .timeline-card {
        text-align: center;
        padding: 20px;
        border-radius: 22px;
        background: white;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .timeline-card svg,
      .timeline-card img {
        width: 100%;
        height: 140px;
        object-fit: contain;
      }
      .timeline-card h2 {
        font-size: 17px;
        margin: 12px 0 8px;
      }
      .timeline-time {
        color: var(--purple);
        font-size: 16px;
        font-weight: 900;
      }
      .empty {
        max-width: 650px;
        margin: 65px auto;
        text-align: center;
      }
      .teacher-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 6px 0 15px;
        margin: 20px 0;
      }
      .tab {
        white-space: nowrap;
        background: white;
        border: 1px solid var(--line);
      }
      .tab.selected {
        background: var(--purple);
        color: white;
      }
      .form-row {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .form-row label {
        flex: 1;
        min-width: 180px;
      }
      .form-row input {
        width: 100%;
      }
      label {
        font-size: 14px;
        font-weight: 700;
      }
      input,
      select {
        border: 1px solid #dcd8e4;
        background: white;
        border-radius: 10px;
        padding: 10px;
        min-height: 46px;
        color: var(--ink);
      }
      .editor-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .edit-card {
        border: 1px solid var(--line);
        border-radius: 19px;
        padding: 17px;
        min-width: 0;
      }
      .edit-card > input {
        width: 100%;
        margin: 12px 0;
      }
      .edit-art {
        height: 140px;
        background: #f5f4ed;
        border-radius: 13px;
      }
      .edit-art svg,
      .edit-art img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .time-fields {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .time-fields select {
        flex: 1;
        min-width: 65px;
      }
      .file-label {
        display: block;
        margin-top: 12px;
      }
      .file-label input {
        display: block;
        max-width: 100%;
        font-size: 12px;
        width: 100%;
        margin-top: 6px;
      }
      .teacher-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 24px 0;
      }
      .summary-card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      .summary-card strong {
        display: block;
      }
      .summary-card small {
        color: var(--muted);
      }
      .summary-card button {
        margin-top: 10px;
        width: 100%;
      }
      .teacher-warning {
        font-size: 13px;
        background: #efedf8;
        border-radius: 13px;
        padding: 14px;
        color: #625a7c;
      }
      .teacher-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }
      .teacher-toolbar h1 {
        font-size: 33px;
        margin: 0;
      }
      .danger {
        color: #a54d45;
      }
      @keyframes breathe {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      @media (max-width: 760px) {
        .page {
          padding: 20px 17px 40px;
        }
        .top {
          margin-bottom: 25px;
        }
        .mode-grid {
          grid-template-columns: 1fr;
        }
        .mode-tile {
          min-height: 220px;
          padding: 24px;
          display: grid;
          grid-template-columns: 1fr auto;
        }
        .mode-top,
        .mode-badge {
          grid-column: 1/-1;
        }
        .mode-symbol {
          grid-column: 2;
          grid-row: 2/4;
          margin: 5px 0;
          font-size: 54px;
        }
        .mode-title {
          grid-column: 1;
          grid-row: 2;
          font-size: 25px;
        }
        .mode-desc {
          grid-column: 1;
          grid-row: 3;
        }
        .mode-badge {
          margin-top: 16px;
        }
        .name-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 13px;
        }
        .name-tile {
          min-height: 150px;
        }
        .reading-grid,
        .editor-grid,
        .practice-layout {
          grid-template-columns: 1fr;
        }
        .timeline {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }
        .timeline-card {
          padding: 12px;
        }
        .timeline-card svg,
        .timeline-card img {
          height: 115px;
        }
        .teacher-summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .order-card {
          gap: 10px;
          padding: 13px 10px;
          flex-wrap: wrap;
        }
        .order-card svg,
        .order-card img {
          width: 65px;
          height: 65px;
        }
        .order-info {
          min-width: 120px;
        }
        .order-controls {
          margin-left: auto;
        }
        .order-info strong {
          font-size: 15px;
        }
        .order-number {
          font-size: 18px;
          min-width: 18px;
        }
        .title-start h1 {
          letter-spacing: -2px;
        }
        .title-caption {
          font-size: 12px;
        }
        .panel {
          padding: 20px;
        }
        .reading-card .hours button {
          min-height: 48px;
        }
      }
      @media print {
        .top,
        .actions,
        .save-note,
        .teacher-tabs,
        .ghost {
          display: none !important;
        }
        .page {
          max-width: none;
          padding: 0;
        }
        .timeline {
          grid-template-columns: repeat(4, 1fr);
        }
        .timeline-card {
          break-inside: avoid;
          box-shadow: none;
        }
        body {
          background: white;
        }
      }

      /* Portrait classroom cards and tablet overview. */
      .avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .student-photo-editor {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .student-photo-editor input {
        max-width: 100%;
      }
      .edit-art {
        height: 300px;
        aspect-ratio: 2/3;
        max-width: 100%;
        margin: auto;
      }
      .timeline-card svg,
      .timeline-card img {
        height: 260px;
        object-fit: contain;
      }
      .reward-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #faf8f1;
        border: 2px solid #e8deca;
        border-radius: 22px;
        padding: 12px;
        width: 100%;
        min-height: 340px;
        height: min(55vh, 460px);
      }
      .reward-card .artwork,
      .reward-card svg {

  <body>
    <div id="app"></div>
    <div id="storage-status" class="save-note" role="status"></div>
    <script>
      'use strict';
      (function () {
        const root = document.getElementById('app'),
          storageNote = document.getElementById('storage-status');
        const KEY = 'sijong.single.v1',
          colors = ['#ffe1d1', '#d6efe3', '#e8e0f8', '#dceafa', '#f9e8b6', '#f4dfe9'];
        const names = ['별이', '하늘', '바다', '초록', '나무', '구름'],
          badges = ['★', '☁', '≈', '✿', '♧', '☀'];
        const titles = [
          '일어나기',
          '아침 먹기',
          '학교 가기',
          '점심 먹기',
          '놀이터 가기',
          '저녁 먹기',
          '책 읽기',
          '잠자기',
        ];
        const times = [420, 450, 480, 720, 900, 1080, 1170, 1230];
        const esc = (v) =>
          String(v ?? '').replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
          );
        const shuffle = (a) => {
          const b = [...a];
          for (let i = b.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [b[i], b[j]] = [b[j], b[i]];
          }
          return b;
        };
        function lessonOrder(cards) {
          const sorted = [...cards].sort((a, b) => a.minute - b.minute).map((c) => c.id);
          const middle = sorted.slice(1, -1);
          let mixed = shuffle(middle);
          for (let i = 0; i < 20 && mixed.some((id, j) => id === middle[j]); i++)
            mixed = shuffle(middle);
          if (mixed.some((id, j) => id === middle[j])) mixed = [...middle.slice(1), middle[0]];
          return [sorted[0], ...mixed, sorted[7]];
        }
        function waiting() {
          return screen === 'practical' && student()?.progress.stage === 'completed';
        }
        function freshProgress(cards, previous) {
          return {
            ...(previous?.completedOrder || previous?.stage === 'completed'
              ? { completedOrder: [...(previous.completedOrder || previous.order)] }
              : {}),
            stage: 'reading',
            answers: {},
            order: lessonOrder(cards),
            flipped: {},
            wrong: [],
            solved: 0,
            practice: null,
          };
        }
        function initial() {
          return {
            version: 1,
            phase: 'active',
            students: names.map((name, i) => {
              const cards = titles.map((t, j) => ({
                id: 's' + i + 'c' + j,
                title: name + '의 ' + t,
                minute: times[j] + i * 30,
                image: '',
                scene: j,
              }));
              return {
                id: 's' + i,
                name,
                distinction: '',
                photo: '',
                cards,
                progress: freshProgress(cards),
              };
            }),
          };
        }
        function validTime(t) {
          return (
            !!t &&
            Number.isInteger(t.hour) &&
            t.hour >= 1 &&
            t.hour <= 12 &&
            (t.minute === 0 || t.minute === 30)
          );
        }
        function validDraft(t) {
          return (
            !!t &&
            (t.hour === null || (Number.isInteger(t.hour) && t.hour >= 1 && t.hour <= 12)) &&
            (t.minute === null || t.minute === 0 || t.minute === 30)
          );
        }
        function valid(data) {
          const safeId = (id) => typeof id === 'string' && /^[a-zA-Z0-9_-]{1,80}$/.test(id);
          return (
            data?.version === 1 &&
            (data.portraitSheet === undefined ||
              (typeof data.portraitSheet === 'string' &&
                /^data:image\/(png|jpeg|webp);base64,/.test(data.portraitSheet))) &&
            ['active', 'ended'].includes(data.phase) &&
            Array.isArray(data.students) &&
            data.students.length === 6 &&
            new Set(data.students.map((s) => s.id)).size === 6 &&
            data.students.every((s) => {
              if (
                !s ||
                !safeId(s.id) ||
                typeof s.name !== 'string' ||
                !s.name.trim() ||
                s.name.length > 30 ||
                (s.photo !== undefined &&
                  (typeof s.photo !== 'string' ||
                    (s.photo !== '' &&
                      !/^preset:[0-5]$/.test(s.photo) &&
                      !/^data:image\/(png|jpeg|webp);base64,/i.test(s.photo)))) ||
                typeof s.distinction !== 'string' ||
                s.distinction.length > 20 ||
                !Array.isArray(s.cards) ||
                s.cards.length !== 8
              )
                return false;
              if (
                new Set(s.cards.map((c) => c.id)).size !== 8 ||
                s.cards.some(
                  (c) =>
                    !c ||
                    !safeId(c.id) ||
                    typeof c.title !== 'string' ||
                    !c.title.trim() ||
                    c.title.length > 60 ||
                    !Number.isInteger(c.minute) ||
                    c.minute < 0 ||
                    c.minute >= 1440 ||
                    c.minute % 30 !== 0 ||
                    typeof c.image !== 'string' ||
                    !Number.isInteger(c.scene) ||
                    c.scene < 0 ||
                    c.scene > 7,
                )
              )
                return false;
              const p = s.progress,
                hasCard = (id) => s.cards.some((c) => c.id === id);
              if (
                !p ||
                !['reading', 'ordering', 'completed'].includes(p.stage) ||
                !Number.isInteger(p.solved) ||
                p.solved < 0 ||
                !Array.isArray(p.order) ||
                p.order.length !== 8 ||
                new Set(p.order).size !== 8 ||
                !p.order.every(hasCard)
              )
                return false;
              if (
                p.completedOrder &&
                (!Array.isArray(p.completedOrder) ||
                  p.completedOrder.length !== 8 ||
                  p.completedOrder.some(
                    (id, i) => id !== [...s.cards].sort((a, b) => a.minute - b.minute)[i].id,
                  ))
              )
                return false;
              if (
                !p.answers ||
                typeof p.answers !== 'object' ||
                Array.isArray(p.answers) ||
                !Object.entries(p.answers).every(([id, t]) => hasCard(id) && validDraft(t))
              )
                return false;
              if (
                !p.flipped ||
                typeof p.flipped !== 'object' ||
                Array.isArray(p.flipped) ||
                !Object.entries(p.flipped).every(
                  ([id, v]) => hasCard(id) && typeof v === 'boolean',
                ) ||
                !Array.isArray(p.wrong) ||
                !p.wrong.every(hasCard)
              )
                return false;
              const q = p.practice;
              return (
                q === null ||
                (!!q &&
                  validTime(q) &&
                  (q.cardId === undefined || hasCard(q.cardId)) &&
                  (q.dismissed === undefined || typeof q.dismissed === 'boolean') &&
                  (q.answer === null || validDraft(q.answer)) &&
                  typeof q.correct === 'boolean' &&
                  ['none', 'minute', 'hour', 'zoom'].includes(q.hint))
              );
            })
          );
        }
        let data = initial(),
          storageError = '';
        try {
          const raw = localStorage.getItem(KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (valid(parsed)) data = parsed;
            else
              storageError =
                '이전에 저장한 자료를 읽지 못해 예시로 열었어요. 원본 저장 내용은 아직 바꾸지 않았어요.';
          }
        } catch {
          storageError =
            '이 브라우저에서는 자동 저장을 사용할 수 없어요. 파일을 닫기 전에 선생님 화면에서 자료를 내보내 주세요.';
        }
        let selectedOrderId = '',
          shareStudentId = '',
          presentationCardId = '',
          presentationFlipped = false,
          editingCardId = '',
          dialogFlipped = false,
          screen = 'title',
          studentId = '',
          message = '',
          messageKind = '',
          teacherId = data.students[0].id,
          teacherDraft = null,
          teacherDirty = false,
          uploading = false;
        const live = {
          enabled: !!document.querySelector('meta[name="classroom-live"]'),
          session: null,
          epoch: '',
          code: '',
          authIds: {},
          revisions: {},
          meta: {},
          lastSeen: 0,
          pending: null,
          sending: false,
          polling: false,
          conflict: false,
          problem: '',
          loginTarget: 'teacher',
          needsAuth: false,
        };
        let settingsReturn = null;
        const LIVE_OUTBOX = 'sijong.live.outbox.v1';
        function portableData() {
          return {
            ...data,
            ...(typeof PORTRAIT_SHEET !== 'undefined' ? { portraitSheet: PORTRAIT_SHEET } : {}),
          };
        }
        function settingsButton() {
          if (waiting()) return '';
          return (
            '<button class="ghost global-settings" data-action="teacher" aria-label="선생님 설정" title="선생님 설정">' +
            icon('settings') +
            '</button>'
          );
        }
        function icon(kind) {
          return (
            '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            (kind === 'home'
              ? '<path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>'
              : '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>') +
            '</svg>'
          );
        }
        function homeButton() {
          if (waiting()) return '';
          return student()
            ? '<button class="ghost global-settings global-home" data-action="home" aria-label="홈" title="모드 선택 화면">' +
                icon('home') +
                '</button>'
            : '';
        }
        async function liveApi(path, method = 'GET', body) {
          const response = await fetch('/api/' + path, {
            method,
            credentials: 'same-origin',
            cache: 'no-store',
            headers: {
              ...(body ? { 'Content-Type': 'application/json' } : {}),
              ...(live.session?.csrfToken ? { 'X-CSRF-Token': live.session.csrfToken } : {}),
            },
            ...(body ? { body: JSON.stringify(body) } : {}),
            signal: AbortSignal.timeout(10000),
          });
          const result = await response.json();
          if (!response.ok)
            throw Object.assign(new Error(result.message || '연결을 확인해 주세요'), {
              status: response.status,
              details: result.details,
            });
          return result;
        }
        function liveText() {
          if (!live.enabled) return '이 기기에 저장된 기록';
          if (!live.session) return '교실에 연결하면 진행 상황을 함께 볼 수 있어요';
          if (live.conflict)
            return '다른 기기의 기록과 겹쳤어요. 설정에서 저장된 기록을 확인해 주세요.';
          if (live.needsAuth)
            return '교실에 다시 연결해 주세요. 보내지 못한 입력은 이 기기에 남아 있어요.';
          if (live.problem)
            return (
              '연결을 다시 시도하고 있어요 · 마지막 확인 ' +
              (live.lastSeen ? new Date(live.lastSeen).toLocaleTimeString('ko-KR') : '전')
            );
          if (live.pending) return '입력을 보내는 중 · 연결이 돌아오면 자동으로 다시 보내요';
          if (!live.epoch) return '선생님이 수업 자료를 열어 주세요';
          return (
            '교실 연결됨 · ' +
            (live.lastSeen
              ? new Date(live.lastSeen).toLocaleTimeString('ko-KR') + ' 확인'
              : '준비 중')
          );
        }
        function rememberOutbox() {
          try {
            if (live.pending) localStorage.setItem(LIVE_OUTBOX, JSON.stringify(live.pending));
            else localStorage.removeItem(LIVE_OUTBOX);
          } catch {
            storageError = '자동 저장 공간이 부족해요. 입력을 보낼 때까지 이 화면을 열어 두세요.';
          }
        }
        function queueLiveProgress() {
          if (!live.enabled || live.session?.role !== 'student' || !student() || live.needsAuth)
            return;
          if (!live.pending)
            live.pending = {
              epoch: live.epoch,
              studentId,
              latest: JSON.parse(JSON.stringify(student().progress)),
              request: null,
            };
          else live.pending.latest = JSON.parse(JSON.stringify(student().progress));
          rememberOutbox();
          void flushLiveProgress();
        }
        async function flushLiveProgress() {
          if (
            !live.pending ||
            live.sending ||
            live.conflict ||
            live.needsAuth ||
            live.session?.role !== 'student'
          )
            return;
          live.sending = true;
          try {
            const pending = live.pending;
            pending.request ||= {
              epoch: pending.epoch,
              expectedRevision: live.revisions[pending.studentId] || 0,
              operationId: crypto.randomUUID(),
              progress: JSON.parse(JSON.stringify(pending.latest)),
              screen,
            };
            rememberOutbox();
            const result = await liveApi('live/progress', 'PUT', pending.request);
            live.revisions[pending.studentId] = result.revision;
            if (JSON.stringify(pending.latest) === JSON.stringify(pending.request.progress))
              live.pending = null;
            else pending.request = null;
            live.problem = '';
            live.lastSeen = Date.now();
            rememberOutbox();
          } catch (err) {
            live.problem = err.message;
            if (err.status === 409) live.conflict = true;
            if (err.status === 401) live.needsAuth = true;
          } finally {
            live.sending = false;
            status();
          }
          if (live.pending && !live.problem) void flushLiveProgress();
        }
        async function loadLiveState() {
          const snapshot = await liveApi('live/state');
          if (!valid(snapshot.data)) throw Error('수업 자료를 읽지 못했어요');
          // Keep a local recovery copy before changing classrooms.
          if (!live.epoch) {
            try {
              localStorage.setItem('sijong.before-online.v1', JSON.stringify(portableData()));
            } catch {}
          }
          data = snapshot.data;
          live.epoch = snapshot.epoch;
          live.code = snapshot.code || '';
          live.authIds = snapshot.authIds;
          live.revisions = {};
          live.meta = {};
          for (const s of snapshot.students) {
            live.revisions[s.id] = s.revision;
            live.meta[s.id] = s;
          }
          studentId = snapshot.studentId || studentId;
          if (live.session.role === 'student') {
            try {
              const pending = JSON.parse(localStorage.getItem(LIVE_OUTBOX) || 'null');
              if (
                pending?.epoch === live.epoch &&
                pending.studentId === studentId &&
                pending.latest
              ) {
                const candidate = JSON.parse(JSON.stringify(data));
                candidate.students.find((s) => s.id === studentId).progress = pending.latest;
                if (valid(candidate)) {
                  data = candidate;
                  live.pending = pending;
                }
              }
            } catch {}
          }
          live.lastSeen = Date.now();
          live.problem = '';
          live.needsAuth = false;
          persist();
          if (live.session.role === 'teacher')
            setTeacher(
              data.students.some((s) => s.id === teacherId) ? teacherId : data.students[0].id,
            );
          void flushLiveProgress();
        }
        async function pollLive() {
          if (
            !live.enabled ||
            !live.session ||
            !live.epoch ||
            live.polling ||
            live.needsAuth ||
            !['teacher', 'student'].includes(live.session.role)
          )
            return;
          live.polling = true;
          try {
            const snap = await liveApi('live/progress?screen=' + encodeURIComponent(screen));
            if (snap.epoch !== live.epoch) {
              live.needsAuth = true;
              throw Error('수업 자료가 바뀌었어요');
            }
            let changed = data.phase !== snap.phase;
            data.phase = snap.phase;
            for (const incoming of snap.students) {
              live.meta[incoming.id] = incoming;
              if (live.session.role === 'student' && (live.pending || live.sending)) continue;
              const s = data.students.find((s) => s.id === incoming.id);
              if (s && JSON.stringify(s.progress) !== JSON.stringify(incoming.progress)) {
                s.progress = incoming.progress;
                changed = true;
              }
              live.revisions[incoming.id] = incoming.revision;
            }
            live.problem = '';
            live.lastSeen = Date.now();
            persist();
            if (
              screen === 'teacher-share' ||
              (changed &&
                live.session.role === 'student' &&
                screen !== 'teacher' &&
                screen !== 'live-login')
            ) {
              const y = scrollY;
              render();
              window.scrollTo(0, y);
            }
          } catch (err) {
            live.problem = err.message;
            if (err.status === 401) live.needsAuth = true;
          } finally {
            live.polling = false;
            status();
          }
          void flushLiveProgress();
        }
        function connectionPanel() {

          return (
            '<section class="panel live-settings"><h2>실시간 교실</h2><p id="connection-note">' +
            esc(liveText()) +
            '</p>' +
            (live.code
              ? '<p>학생용 교실 코드 <strong class="class-code">' + esc(live.code) + '</strong></p>'
              : '') +
            '<p>태블릿에서도 같은 웹주소를 열고 교실 코드를 입력해 주세요.</p><div class="actions"><button class="primary" data-action="live-publish">' +
            (live.epoch ? '수정한 자료로 수업 다시 열기' : '이 자료로 수업 열기') +
            '</button><button class="secondary" data-action="live-logout">연결 해제</button></div><p class="subtle">자료를 수정했다면 수업을 다시 열어 적용해 주세요. 학생들은 새 코드로 다시 연결합니다.</p></section>'
          );
        }
        function renderLiveLogin() {
          const teacher = live.loginTarget !== 'student';
          return page(
            '<div class="top"><span class="brand">교실 연결</span><button class="secondary" data-action="live-login-back">이전 화면으로</button></div><section class="panel connection-form"><h1>' +
              (teacher ? '선생님 접속' : '우리 교실에 들어가요') +
              '</h1><p>' +
              (teacher
                ? '선생님 비밀번호로 설정과 공유화면을 열어요.'
                : '선생님이 알려 준 여섯 자리 교실 코드를 입력해요.') +
              '</p>' +
              notice() +
              '<form id="live-login-form"><label>' +
              (teacher ? '선생님 비밀번호' : '교실 코드') +
              '<input name="credential" aria-label="' +
              (teacher ? '선생님 비밀번호' : '교실 코드') +
              '" type="' +
              (teacher ? 'password' : 'text') +
              '" ' +
              (teacher
                ? 'autocomplete="current-password"'
                : 'inputmode="numeric" maxlength="6" autocomplete="off"') +
              ' required></label><button class="primary" type="submit">' +
              (teacher ? '선생님 접속하기' : '교실 연결하기') +
              '</button></form></section>',
          );
        }

              return;
            }
            uploading = true;
            render();
            try {
              const image = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                  const img = new Image();
                  img.onload = () => resolve(img);
                  img.onerror = () => reject(Error('그림 파일을 읽지 못했어요.'));
                  img.src = reader.result;
                };
                reader.onerror = () => reject(Error('그림 파일을 읽지 못했어요.'));
                reader.readAsDataURL(file);
              });
              const ratio = Math.min(
                  1,
                  (isPhoto ? 320 : 960) / Math.max(image.width, image.height),
                ),
                canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(image.width * ratio));
              canvas.height = Math.max(1, Math.round(image.height * ratio));
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#fff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
              if (isPhoto) teacherDraft.photo = canvas.toDataURL('image/jpeg', 0.85);
              else c.image = canvas.toDataURL('image/jpeg', 0.85);
              teacherDirty = true;
              message = isPhoto
                ? '학생 사진을 바꿨어요. 이 학생 저장을 눌러 주세요.'
                : '그림을 바꿨어요. 이 학생 저장을 눌러 주세요.';
              messageKind = 'success';
            } catch (err) {
              message = err.message;
              messageKind = 'error';
            } finally {
              uploading = false;
              render();
            }
            return;
          }
          if (input.tagName === 'SELECT' && c) {
            const field = input.dataset.field,
              value = Number(input.value);
            let period = c.minute < 720 ? 0 : 1,
              hour = Math.floor(c.minute / 60) % 12 || 12,
              minute = c.minute % 60;
            if (field === 'period') period = value;
            if (field === 'hour') hour = value;
            if (field === 'minute') minute = value;
            c.minute = period * 720 + (hour % 12) * 60 + minute;
            markTeacherDirty();
          }
        });
        window.addEventListener('keydown', (e) => {
          if (
            screen === 'title' &&
            !e.repeat &&
            !e.ctrlKey &&
            !e.altKey &&
            !e.metaKey &&
            !['Tab', 'Shift', 'Control', 'Alt', 'Meta', 'Escape'].includes(e.key) &&
            !e.target.closest('button[data-action="teacher"],button[data-action="teacher-gallery"]')
          ) {
            e.preventDefault();
            root.querySelector('[data-action="start"]').click();
          }
        });
        window.addEventListener('beforeunload', (e) => {
          if (teacherDirty || uploading || live.pending) {
            e.preventDefault();
            e.returnValue = '';
          }
        });
        render();
        void bootLive();
      })();
    </script>
  </body>
</html>
