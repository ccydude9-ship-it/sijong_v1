<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171a38" />
    <title>시계는 째깍! 하루는 찰칵!</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #252945;
        --muted: #72748b;
        --paper: #faf8f1;
        --line: #e7e3d9;
        --purple: #6359ce;
        --mint: #d6efe3;
        --peach: #ffe1d1;
        --lavender: #e8e0f8;
        --shadow: 0 8px 0 rgba(37, 41, 69, 0.07);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          17px/1.55 'Apple SD Gothic Neo',
          'Malgun Gothic',
          system-ui,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        border: 0;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #8c71f1;
        outline-offset: 4px;
      }
      button {
        touch-action: manipulation;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: clamp(30px, 4vw, 46px);
        letter-spacing: -2px;
        line-height: 1.3;
      }
      h2 {
        font-size: 25px;
      }
      p {
        color: var(--muted);
      }
      .page {
        max-width: 1180px;
        margin: auto;
        padding: 28px 32px 60px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 36px;
        flex-wrap: wrap;
      }
      .brand {
        font-weight: 900;
        letter-spacing: -1px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 9px 17px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 30px;
        font-weight: 800;
      }
      .chip:before {
        content: '✦';
        color: var(--purple);
      }
      .primary,
      .secondary,
      .ghost,
      .tab {
        min-height: 48px;
        border-radius: 14px;
        padding: 12px 20px;
        font-weight: 800;
      }
      .primary {
        background: var(--purple);
        color: white;
        box-shadow: 0 4px 0 #48409e;
      }
      .primary:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #48409e;
      }
      .secondary {
        background: white;
        border: 1px solid var(--line);
      }
      .ghost {
        background: transparent;
      }
      .ghost:hover {
        background: #ece8de;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--purple);
        display: block;
        margin-bottom: 12px;
      }
      .heading {
        text-align: center;
        margin: 20px 0 38px;
      }
      .heading h1 {
        margin-bottom: 12px;
      }
      .heading p {
        margin-bottom: 0;
      }
      .subtle {
        font-size: 14px;
        color: var(--muted);
      }
      .center {
        text-align: center;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 26px;
        box-shadow: var(--shadow);
      }
      .notice {
        background: #fff0ca;
        padding: 14px 20px;
        border-radius: 14px;
        margin: 18px 0;
        color: #6d561b;
      }
      .notice.error {
        background: #fff0ed;
        color: #9e3d35;
      }
      .notice.success {
        background: #e1f3e6;
        color: #2c6c4a;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 25px;
      }
      .footer-note {
        text-align: center;
        font-size: 14px;
        margin-top: 28px;
      }
      .save-note {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        padding: 12px;
      }
      .title-page {
        min-height: 100svh;
        background: #171a38;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 24px 32px;
        text-align: center;
        overflow: hidden;
        position: relative;
        background-image:
          radial-gradient(circle at 16% 22%, #43517c 1px, transparent 2px),
          radial-gradient(circle at 79% 37%, #6b719c 1px, transparent 2px),
          linear-gradient(#171a38, #232046);
        background-size:
          79px 83px,
          133px 149px,
          100% 100%;
      }
      .title-page:before {
        content: '';
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        border: 1px solid #727ca533;
        box-shadow:
          0 0 0 60px #727ca50b,
          0 0 0 120px #727ca507;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        pointer-events: none;
      }
      .arcade-label {
        font: 700 12px/1.4 monospace;
        letter-spacing: 6px;
        color: #c0b7ed;
        margin: 20px 0 22px;
      }
      .title-start {
        background: transparent;
        color: white;
        z-index: 1;
        padding: 10px;
        max-width: 100%;
        border-radius: 24px;
      }
      .title-start h1 {
        font-size: clamp(42px, 7.8vw, 82px);
        line-height: 1.28;
        font-weight: 950;
        letter-spacing: -4px;
        text-shadow: 0 5px 0 #0a102d;
        margin: 0;
      }
      .title-start h1 span {
        display: block;
        color: #ffde88;
      }
      .title-start h1 span:first-child {
        color: #d1f2ef;
      }
      .press {
        margin-top: 48px;
        color: #f5d586;
        font: 700 17px monospace;
        letter-spacing: 4px;
        animation: breathe 2.5s ease-in-out infinite;
      }
      .title-caption {
        color: #c6c6da;
        font-size: 14px;
        margin-top: 12px;
      }
      .title-footer {
        z-index: 1;
        margin-top: 55px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .title-footer .ghost {
        color: #c6c6da;
        border: 1px solid #ffffff22;
      }
      .title-footer .ghost:hover {
        background: #ffffff12;
      }
      .mascot-clock {
        width: 100px;
        height: 100px;
        background: #fff9e9;
        border: 8px solid #8dd9cf;
        border-radius: 50%;
        position: relative;
        margin: 0 auto 25px;
        box-shadow: 0 8px 0 #0e122b;
        transform: rotate(-10deg);
      }
      .mascot-clock:before {
        content: '';
        position: absolute;
        left: 39px;
        top: 19px;
        width: 6px;
        height: 27px;
        background: #313752;
        border-radius: 8px;
        transform-origin: 3px 25px;
        transform: rotate(15deg);
      }
      .mascot-clock:after {
        content: '';
        position: absolute;
        left: 40px;
        top: 39px;
        width: 27px;
        height: 5px;
        background: #e59675;
        border-radius: 8px;
        transform: rotate(20deg);
        transform-origin: left center;
      }
      .name-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 850px;
        margin: 0 auto;
      }
      .name-tile {
        min-height: 175px;
        border: 2px solid #fff;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 13px;
        box-shadow: var(--shadow);
        transition: transform 0.18s;
      }
      .name-tile:hover,
      .mode-tile:hover {
        transform: translateY(-5px);
      }
      .avatar {
        width: 65px;
        height: 65px;
        border-radius: 22px;
        background: #ffffff99;
        display: grid;
        place-items: center;
        font-size: 33px;
      }
      .name-text {
        font-size: 25px;
        font-weight: 900;
      }
      .mode-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 23px;
      }
      .mode-tile {
        min-height: 330px;
        padding: 30px;
        text-align: left;
        border-radius: 28px;
        border: 2px solid #fff;
        box-shadow: var(--shadow);
        transition: transform 0.18s;
        display: flex;
        flex-direction: column;
      }
      .mode-top {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 800;
      }
      .mode-symbol {
        font-size: 66px;
        line-height: 1.4;
        margin: 23px 0 16px;
      }
      .mode-title {
        font-size: 27px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .mode-desc {
        font-size: 15px;
        margin-top: 5px;
        color: #565a6b;
      }
      .mode-badge {
        font-size: 12px;
        font-weight: 700;
        margin-top: 25px;
        padding: 5px 12px;
        border-radius: 20px;
        background: #ffffffaa;
        align-self: flex-start;
      }
      .clock {
        display: block;
        width: min(100%, 300px);
        margin: auto;
      }
      .practice-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        max-width: 920px;
        margin: auto;
      }
      .clock-panel {
        display: grid;
        place-items: center;
      }
      .hint-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 15px;
      }
      .clock.zoom {
        transform: scale(1.08);
      }
      .time-readout {
        text-align: center;
        font-size: 35px;
        font-weight: 900;
        margin-bottom: 18px;
        min-height: 54px;
      }
      .time-readout span {
        color: var(--purple);
      }
      .hours {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 7px;
      }
      .hours button,
      .minutes button {
        min-width: 0;
        min-height: 48px;
        background: #f4f2fa;
        border: 2px solid transparent;
        border-radius: 12px;
        font-weight: 800;
      }
      .hours button[aria-pressed='true'],
      .minutes button[aria-pressed='true'] {
        background: #e5defc;
        border-color: var(--purple);
        color: #40349e;
      }
      .minutes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-top: 10px;
      }
      .input-error {
        border: 3px solid #cf594d;
        border-radius: 16px;
        padding: 10px;
      }
      .input-caption {
        font-size: 13px;
        color: #a3453c;
        margin: 8px 0 0;
      }
      .correct {
        font-size: 24px;
        font-weight: 900;
        color: #398261;
        text-align: center;
      }
      .stat {
        font-size: 14px;
        text-align: center;
        margin-top: 12px;
      }
      .reading-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .reading-card {
        padding: 20px;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .card-top h2 {
        font-size: 18px;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .period {
        font-size: 12px;
        font-weight: 900;
        background: #f0ebfc;
        color: #6757ad;
        border-radius: 12px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      .picture-button {
        width: 100%;
        height: 185px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: #f6f5ef;
        position: relative;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .picture-button svg {
        max-height: 165px;
        width: 100%;
      }
      .picture-button .clock {
        height: 165px;
      }
      .flip-hint {
        position: absolute;
        bottom: 7px;
        right: 10px;
        font-size: 11px;
        padding: 3px 9px;
        background: #ffffffe0;
        border-radius: 10px;
      }
      .artwork {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .reading-card .time-readout {
        font-size: 26px;
        margin-bottom: 10px;
        min-height: 40px;
      }
      .reading-card .hours {
        gap: 5px;
      }
      .reading-card .time-input {
        margin-top: 5px;
      }
      .reading-card .hours button {
        min-height: 44px;
      }
      .order-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 780px;
        margin: auto;
      }
      .order-card {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 20px;
        background: white;
        border: 2px solid var(--line);
        border-radius: 22px;
        touch-action: pan-y;
      }
      .order-card.wrong {
        border: 3px solid #cf594d;
      }
      .order-card svg,
      .order-card img {
        width: 90px;
        height: 75px;
        border-radius: 13px;
        background: #f6f4eb;
        flex-shrink: 0;
        object-fit: contain;
      }
      .order-number {
        font-weight: 900;
        font-size: 23px;
        color: #9e95c5;
        min-width: 26px;
      }
      .order-info {
        flex: 1;
      }
      .order-info strong {
        display: block;
        font-size: 18px;
      }
      .order-info small {
        color: var(--muted);
      }
      .order-controls {
        display: flex;
        gap: 6px;
      }
      .move {
        min-width: 48px;
        min-height: 48px;
        border-radius: 12px;
        background: #f0edf7;
        font-size: 21px;
      }
      .completed {
        max-width: 650px;
        margin: 55px auto;
        text-align: center;
      }
      .confetti {
        font-size: 70px;
        line-height: 1.4;
      }
      .timeline {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
      .timeline-card {
        text-align: center;
        padding: 20px;
        border-radius: 22px;
        background: white;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .timeline-card svg,
      .timeline-card img {
        width: 100%;
        height: 140px;
        object-fit: contain;
      }
      .timeline-card h2 {
        font-size: 17px;
        margin: 12px 0 8px;
      }
      .timeline-time {
        color: var(--purple);
        font-size: 16px;
        font-weight: 900;
      }
      .empty {
        max-width: 650px;
        margin: 65px auto;
        text-align: center;
      }
      .teacher-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 6px 0 15px;
        margin: 20px 0;
      }
      .tab {
        white-space: nowrap;
        background: white;
        border: 1px solid var(--line);
      }
      .tab.selected {
        background: var(--purple);
        color: white;
      }
      .form-row {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .form-row label {
        flex: 1;
        min-width: 180px;
      }
      .form-row input {
        width: 100%;
      }
      label {
        font-size: 14px;
        font-weight: 700;
      }
      input,
      select {
        border: 1px solid #dcd8e4;
        background: white;
        border-radius: 10px;
        padding: 10px;
        min-height: 46px;
        color: var(--ink);
      }
      .editor-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .edit-card {
        border: 1px solid var(--line);
        border-radius: 19px;
        padding: 17px;
        min-width: 0;
      }
      .edit-card > input {
        width: 100%;
        margin: 12px 0;
      }
      .edit-art {
        height: 140px;
        background: #f5f4ed;
        border-radius: 13px;
      }
      .edit-art svg,
      .edit-art img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .time-fields {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .time-fields select {
        flex: 1;
        min-width: 65px;
      }
      .file-label {
        display: block;
        margin-top: 12px;
      }
      .file-label input {
        display: block;
        max-width: 100%;
        font-size: 12px;
        width: 100%;
        margin-top: 6px;
      }
      .teacher-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 24px 0;
      }
      .summary-card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      .summary-card strong {
        display: block;
      }
      .summary-card small {
        color: var(--muted);
      }
      .summary-card button {
        margin-top: 10px;
        width: 100%;
      }
      .teacher-warning {
        font-size: 13px;
        background: #efedf8;
        border-radius: 13px;
        padding: 14px;
        color: #625a7c;
      }
      .teacher-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }
      .teacher-toolbar h1 {
        font-size: 33px;
        margin: 0;
      }
      .danger {
        color: #a54d45;
      }
      @keyframes breathe {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      @media (max-width: 760px) {
        .page {
          padding: 20px 17px 40px;
        }
        .top {
          margin-bottom: 25px;
        }
        .mode-grid {
          grid-template-columns: 1fr;
        }
        .mode-tile {
          min-height: 220px;
          padding: 24px;
          display: grid;
          grid-template-columns: 1fr auto;
        }
        .mode-top,
        .mode-badge {
          grid-column: 1/-1;
        }
        .mode-symbol {
          grid-column: 2;
          grid-row: 2/4;
          margin: 5px 0;
          font-size: 54px;
        }
        .mode-title {
          grid-column: 1;
          grid-row: 2;
          font-size: 25px;
        }
        .mode-desc {
          grid-column: 1;
          grid-row: 3;
        }
        .mode-badge {
          margin-top: 16px;
        }
        .name-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 13px;
        }
        .name-tile {
          min-height: 150px;
        }
        .reading-grid,
        .editor-grid,
        .practice-layout {
          grid-template-columns: 1fr;
        }
        .timeline {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }
        .timeline-card {
          padding: 12px;
        }
        .timeline-card svg,
        .timeline-card img {
          height: 115px;
        }
        .teacher-summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .order-card {
          gap: 10px;
          padding: 13px 10px;
          flex-wrap: wrap;
        }
        .order-card svg,
        .order-card img {
          width: 65px;
          height: 65px;
        }
        .order-info {
          min-width: 120px;
        }
        .order-controls {
          margin-left: auto;
        }
        .order-info strong {
          font-size: 15px;
        }
        .order-number {
          font-size: 18px;
          min-width: 18px;
        }
        .title-start h1 {
          letter-spacing: -2px;
        }
        .title-caption {
          font-size: 12px;
        }
        .panel {
          padding: 20px;
        }
        .reading-card .hours button {
          min-height: 48px;
        }
      }
      @media print {
        .top,
        .actions,
        .save-note,
        .teacher-tabs,
        .ghost {
          display: none !important;
        }
        .page {
          max-width: none;
          padding: 0;
        }
        .timeline {
          grid-template-columns: repeat(4, 1fr);
        }
        .timeline-card {
          break-inside: avoid;
          box-shadow: none;
        }
        body {
          background: white;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="storage-status" class="save-note" role="status"></div>
    <script>
      'use strict';
      (function () {
        const root = document.getElementById('app'),
          storageNote = document.getElementById('storage-status');
        const KEY = 'sijong.single.v1',
          colors = ['#ffe1d1', '#d6efe3', '#e8e0f8', '#dceafa', '#f9e8b6', '#f4dfe9'];
        const names = ['별이', '하늘', '바다', '초록', '나무', '구름'],
          badges = ['★', '☁', '≈', '✿', '♧', '☀'];
        const titles = [
          '일어나기',
          '아침 먹기',
          '학교 가기',
          '점심 먹기',
          '놀이터 가기',
          '저녁 먹기',
          '책 읽기',
          '잠자기',
        ];
        const times = [420, 450, 480, 720, 900, 1080, 1170, 1230];
        const esc = (v) =>
          String(v ?? '').replace(
            /[&<>"']/g,

                  !a ||
                  a.hour !== (Math.floor(c.minute / 60) % 12 || 12) ||
                  a.minute !== c.minute % 60
                );
              })
              .map((c) => c.id);
            if (p.wrong.length) {
              saveProgress();
              feedback('표시된 시각을 다시 읽어 볼까요? 아직 안 고른 시각도 확인해 주세요.');
            } else {
              p.stage = 'ordering';
              p.wrong = [];
              saveProgress();
              navigate('practical');
            }
            return;
          }
          if (action === 'move') {
            const index = p.order.indexOf(id),
              target = index + Number(button.dataset.direction);
            if (target < 0 || target >= 8) return;
            keepScroll(() => {
              [p.order[index], p.order[target]] = [p.order[target], p.order[index]];
              p.wrong = [];
              message = '';
              saveProgress();
            });
            const control = root.querySelector(
              '[data-action="move"][data-id="' +
                id +
                '"][data-direction="' +
                button.dataset.direction +
                '"]',
            );
            if (control && !control.disabled) control.focus({ preventScroll: true });
            return;
          }
          if (action === 'read-again') {
            p.stage = 'reading';
            p.wrong = [];
            saveProgress();
            navigate('practical');
            return;
          }
          if (action === 'order-check') {
            const expected = [...s.cards].sort((a, b) => a.minute - b.minute).map((c) => c.id);
            p.wrong = p.order.filter((id, i) => id !== expected[i]);
            if (p.wrong.length) {
              saveProgress();
              feedback('표시된 카드의 순서를 다시 살펴볼까요?');
            } else {
              p.stage = 'completed';
              saveProgress();
              play();
              navigate('practical');
            }
          }
        });
        root.addEventListener('input', (e) => {
          const input = e.target;
          if (screen !== 'teacher' || !input.dataset.field) return;
          const f = input.dataset.field;
          if (f === 'name' || f === 'distinction') teacherDraft[f] = input.value;
          else if (f === 'title')
            teacherDraft.cards[Number(input.dataset.card)].title = input.value;
          else return;
          markTeacherDirty();
        });
        root.addEventListener('change', async (e) => {
          const input = e.target;
          if (input.id === 'import-file') {
            const file = input.files?.[0];
            if (!file) return;
            if (!confirmTeacherLeave()) return;
            try {
              if (file.size > 18000000) throw Error('자료 파일은 18MB 이하로 준비해 주세요.');
              const incoming = JSON.parse(await file.text());
              if (!valid(incoming)) throw Error('이 앱에서 내보낸 수업 자료 파일을 선택해 주세요.');
              if (
                !window.confirm('현재 이 브라우저의 이름·그림·학습 기록을 불러온 자료로 바꿀까요?')
              )
                return;
              data = incoming;
              teacherId = data.students[0].id;
              setTeacher(teacherId);
              persist();
              feedback('수업 자료를 불러왔어요.', 'success');
            } catch (err) {
              feedback(err.message || '자료를 읽지 못했어요.');
            }
            return;
          }
          if (screen !== 'teacher') return;
          const index = Number(input.dataset.card),
            c = teacherDraft.cards[index];
          if (input.type === 'file') {
            const file = input.files?.[0];
            if (!file) return;
            if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type)) {
              feedback('PNG, JPEG, WebP 그림 파일을 선택해 주세요.');
              return;
            }
            if (file.size > 5000000) {
              feedback('그림은 한 장에 5MB 이하로 준비해 주세요.');
              return;
            }
            uploading = true;
            render();
            try {
              const image = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                  const img = new Image();
                  img.onload = () => resolve(img);
                  img.onerror = () => reject(Error('그림 파일을 읽지 못했어요.'));
                  img.src = reader.result;
                };
                reader.onerror = () => reject(Error('그림 파일을 읽지 못했어요.'));
                reader.readAsDataURL(file);
              });
              const ratio = Math.min(1, 480 / Math.max(image.width, image.height)),
                canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(image.width * ratio));
              canvas.height = Math.max(1, Math.round(image.height * ratio));
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#fff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
              c.image = canvas.toDataURL('image/jpeg', 0.8);
              teacherDirty = true;
              message = '그림을 바꿨어요. 이 학생 저장을 눌러 주세요.';
              messageKind = 'success';
            } catch (err) {
              message = err.message;
              messageKind = 'error';
            } finally {
              uploading = false;
              render();
            }
            return;
          }
          if (input.tagName === 'SELECT' && c) {
            const field = input.dataset.field,
              value = Number(input.value);
            let period = c.minute < 720 ? 0 : 1,
              hour = Math.floor(c.minute / 60) % 12 || 12,
              minute = c.minute % 60;
            if (field === 'period') period = value;
            if (field === 'hour') hour = value;
            if (field === 'minute') minute = value;
            c.minute = period * 720 + (hour % 12) * 60 + minute;
            markTeacherDirty();
          }
        });
        root.addEventListener('dragstart', (e) => {
          const card = e.target.closest('[data-order-id]');
          if (!card || !editAllowed()) return;
          dragging = card.dataset.orderId;
          e.dataTransfer?.setData('text/plain', dragging);
          if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
        });
        root.addEventListener('dragover', (e) => {
          if (dragging && e.target.closest('[data-order-id]')) e.preventDefault();
        });
        root.addEventListener('drop', (e) => {
          const target = e.target.closest('[data-order-id]');
          if (!target || !dragging || !editAllowed()) return;
          e.preventDefault();
          const order = student().progress.order,
            from = order.indexOf(dragging),
            to = order.indexOf(target.dataset.orderId);
          if (from >= 0 && to >= 0) {
            keepScroll(() => {
              order.splice(to, 0, order.splice(from, 1)[0]);
              student().progress.wrong = [];
              message = '';
              saveProgress();
            });
          }
          dragging = null;
        });
        root.addEventListener('dragend', () => (dragging = null));
        window.addEventListener('keydown', (e) => {
          if (
            screen === 'title' &&
            !e.repeat &&
            !e.ctrlKey &&
            !e.altKey &&
            !e.metaKey &&
            !['Tab', 'Shift', 'Control', 'Alt', 'Meta', 'Escape'].includes(e.key) &&
            !e.target.closest('button[data-action="teacher"]')
          ) {
            e.preventDefault();
            navigate('names');
          }
        });
        window.addEventListener('beforeunload', (e) => {
          if (teacherDirty || uploading) {
            e.preventDefault();
            e.returnValue = '';
          }
        });
        render();
      })();
    </script>
  </body>
</html>
